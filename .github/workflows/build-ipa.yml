name: Build iOS IPA & Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ipa:
    name: Build IPA (iOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Build .app
        run: |
          set -e
          xcodebuild -project UnityPort/Builds/iOS/Unity-iPhone.xcodeproj \
            -scheme Unity-iPhone -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
            CONFIGURATION_BUILD_DIR=/tmp/build | xcpretty

      - name: Package IPA
        run: |
          set -e
          mkdir -p /tmp/Payload
          cp -R /tmp/build/Loan12SuQuan.app /tmp/Payload/
          cd /tmp && zip -r Loan12-iPhone.ipa Payload/
          echo "IPA size: $(wc -c < Loan12-iPhone.ipa) bytes"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Loan12-iPhone
          path: /tmp/Loan12-iPhone.ipa

  build-apk:
    name: Build APK (Android)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Build APK
        uses: game-ci/unity-builder@v4
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          projectPath: UnityPort
          targetPlatform: Android
          buildMethod: Loan12AndroidBuildSettings.BuildApk
          versioning: None
          androidKeystoreName: ${{ secrets.ANDROID_KEYSTORE_NAME }}
          androidKeystorePass: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          androidKeyaliasName: ${{ secrets.ANDROID_KEY_ALIAS }}
          androidKeyaliasPass: ${{ secrets.ANDROID_KEY_PASS }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Loan12-Android
          path: build/Android/*.apk
          if-no-files-found: warn
