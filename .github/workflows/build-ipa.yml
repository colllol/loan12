name: Build iOS IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4

      - name: Install xcpretty
        run: gem install xcpretty

      - name: Build unsigned IPA
        run: |
          set -e
          XCODE_PROJ="UnityPort/Builds/iOS/Unity-iPhone.xcodeproj"
          SCHEME="Unity-iPhone"

          xcodebuild -project "$XCODE_PROJ" -scheme "$SCHEME" -configuration Release \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
            CONFIGURATION_BUILD_DIR=/tmp/build | xcpretty

          mkdir -p /tmp/Payload
          cp -R /tmp/build/Unity-iPhone.app /tmp/Payload/
          cd /tmp && zip -r Unity-iPhone.ipa Payload/

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Loan12-iPhone
          path: /tmp/Unity-iPhone.ipa
