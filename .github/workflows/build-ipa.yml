name: Build iOS IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install xcpretty
        run: gem install xcpretty

      - name: Build .app
        run: |
          set -e
          xcodebuild -project UnityPort/Builds/iOS/Unity-iPhone.xcodeproj \
            -scheme Unity-iPhone -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
            CONFIGURATION_BUILD_DIR=/tmp/build | xcpretty

      - name: Package IPA
        run: |
          set -e
          mkdir -p /tmp/Payload
          cp -R /tmp/build/Loan12SuQuan.app /tmp/Payload/
          cd /tmp && zip -r Loan12-iPhone.ipa Payload/
          echo "IPA size: $(wc -c < Loan12-iPhone.ipa) bytes"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Loan12-iPhone
          path: /tmp/Loan12-iPhone.ipa
